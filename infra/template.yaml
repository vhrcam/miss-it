AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "Miss It?, spoiler-free recaps of what's on your TV for Alexa+"

Parameters:
  DeviceKey:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Shared key the Fire TV app sends with every playback update
  ModelId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0
    Description: Amazon Bedrock model or inference profile that writes recaps and answers
  NovaApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional key for Amazon's direct Nova API, used instead of Bedrock when set

Resources:
  MemoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  MissItFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../server/dist/lambda
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 20
      Environment:
        Variables:
          MISS_IT_TABLE: !Ref MemoryTable
          MISS_IT_DEVICE_KEY: !Ref DeviceKey
          MISS_IT_MODEL_ID: !Ref ModelId
          NOVA_API_KEY: !Ref NovaApiKey
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MemoryTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - arn:aws:bedrock:*::foundation-model/amazon.nova-*
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
      FunctionUrlConfig:
        AuthType: NONE

Outputs:
  MissItUrl:
    Description: Base URL for the Fire TV app; the MCP endpoint is this URL plus /mcp
    Value: !GetAtt MissItFunctionUrl.FunctionUrl
  MemoryTableName:
    Description: DynamoDB table that holds each household's watch log
    Value: !Ref MemoryTable
